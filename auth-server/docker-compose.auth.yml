version: "3.9"

services:
  mariadb:
    image: mariadb:latest
    container_name: ${DB_NAME}
    ports:
      - ${DB_PORT}:3306
    restart: always
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb-vl:/var/lib/mariadb
  redis:
    image: redis:latest
    container_name: ${REDIS_NAME}
    ports:
      - ${REDIS_PORT}:6379
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 10
    volumes:
      - redis-vl:/var/lib/redis
volumes:
  mariadb-vl:
    driver: local
  redis-vl:
    driver: local
